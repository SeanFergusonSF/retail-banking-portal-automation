name: Bank Portal Automation CI

# ============================================================
# TRIGGER - When does this pipeline run?
# ============================================================
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

# ============================================================
# ENVIRONMENT VARIABLES - Available to all jobs
# ============================================================
env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m'

# ============================================================
# JOBS
# ============================================================
jobs:

  # ----------------------------------------------------------
  # JOB 1 - Build and Compile
  # ----------------------------------------------------------
  build:
    name: Build & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile framework
        run: mvn clean compile test-compile --no-transfer-progress

      - name: Confirm build success
        run: echo "Build and compile completed successfully"

  # ----------------------------------------------------------
  # JOB 2 - OWASP Dependency Check
  # Runs after build, before tests
  # Scans dependencies for known CVEs
  # ----------------------------------------------------------
  security-scan:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true  # Don't block tests if NVD is unreachable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run OWASP Dependency Check
        run: |
          mvn dependency-check:check \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            --no-transfer-progress
        continue-on-error: true

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-report
          path: target/dependency-check-report/
          retention-days: 30

  # ----------------------------------------------------------
  # JOB 3 - API Tests
  # Fast feedback gate - runs before UI tests
  # No browser needed, WireMock handles all API mocking
  # ----------------------------------------------------------
  api-tests:
    name: API Tests (WireMock)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run API test suite
        run: mvn test -Dtest=ApiTestRunner --no-transfer-progress

      - name: Upload API test reports
        uses: actions/upload-artifact@v4
        if: always()  # Upload even if tests fail
        with:
          name: api-test-reports
          path: |
            target/cucumber-reports/api-report.html
            target/cucumber-reports/api-report.json
            target/surefire-reports/
          retention-days: 30

  # ----------------------------------------------------------
  # JOB 4 - UI Tests
  # Runs AFTER API tests pass - enforced by needs: api-tests
  # Spring Boot mock site starts as background process
  # Chrome runs in headless mode
  # ----------------------------------------------------------
  ui-tests:
    name: UI Tests (Headless Chrome)
    runs-on: ubuntu-latest
    needs: api-tests  # Only runs if API tests pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Start mock bank site
        run: |
          cd mock-bank-site
          mvn spring-boot:run --no-transfer-progress &
          echo "Waiting for mock site to start on port 8080..."
          timeout 60 bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 2; done'
          echo "Mock bank site is running"

      - name: Run UI test suite
        run: |
          mvn test \
            -Dtest=UiTestRunner \
            -Dheadless=true \
            --no-transfer-progress

      - name: Upload UI test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-reports
          path: |
            target/cucumber-reports/ui-report.html
            target/cucumber-reports/ui-report.json
            target/screenshots/
            target/surefire-reports/
          retention-days: 30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: target/logs/
          retention-days: 30

      - name: Stop mock bank site
        if: always()
        run: pkill -f "spring-boot:run" || true

  # ----------------------------------------------------------
  # JOB 5 - Quality Gate
  # Final summary job - only passes if all test jobs passed
  # ----------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [ api-tests, ui-tests ]
    if: always()

    steps:
      - name: Check API test result
        if: needs.api-tests.result != 'success'
        run: |
          echo "API tests failed - quality gate not passed"
          exit 1

      - name: Check UI test result
        if: needs.ui-tests.result != 'success'
        run: |
          echo "UI tests failed - quality gate not passed"
          exit 1

      - name: Quality gate passed
        run: |
          echo "========================================"
          echo "All quality gates passed successfully"
          echo "API Tests:  PASSED"
          echo "UI Tests:   PASSED"
          echo "========================================"