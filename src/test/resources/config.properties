# Environment (local | qa | staging)
env=local

# Base URLs
local.base.url=http://localhost:8080
qa.base.url=https://qa.bankportal.internal
staging.base.url=https://staging.bankportal.internal

# WireMock
wiremock.host=localhost
wiremock.port=8089

# Browser
browser=chrome
headless=false

# Timeouts (seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30